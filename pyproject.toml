[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "CANape"
version = "1.0.0"
description = "Pythonic wrapper for Vector CANape using the ASAM-MCD3 Interface (CANapeAPI)"
readme = "README.md"
requires-python = ">=3.8,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Jed Frey", email = ""},
]
maintainers = [
    {name = "Jed Frey", email = ""},
]
keywords = [
    "CANape",
    "Vector",
    "ASAP3",
    "ASAM-MCD3",
    "automotive",
    "ECU",
    "calibration",
    "measurement",
    "CAN",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "cached-property>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
data = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]
all = [
    "CANape[dev,data]",
]

[project.urls]
Homepage = "https://github.com/jed-frey/python_CANape"
Documentation = "https://github.com/jed-frey/python_CANape#readme"
Repository = "https://github.com/jed-frey/python_CANape"
Issues = "https://github.com/jed-frey/python_CANape/issues"

[tool.setuptools]
packages = ["CANape", "CANapAPI"]

[tool.setuptools.package-data]
CANape = ["py.typed"]

[tool.setuptools.package-dir]
"" = "."

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "versioneer.*",
    "CANape._version.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=CANape",
    "--cov=CANapAPI",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_canape: marks tests that require CANape to be installed",
]

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
  | versioneer.py
)/
'''

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "F403",  # star imports (needed for ctypes structures)
    "F405",  # may be undefined from star imports (acceptable for ctypes)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"versioneer.py" = ["E501", "F401", "F403", "UP031", "UP036", "B007"]  # versioneer has its own style
"_version.py" = ["E501", "F401", "F403", "UP031", "UP036", "B007"]  # versioneer generated file
"core/structs.py" = ["F403", "F405"]  # star imports needed for ctypes compatibility

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["CANape", "CANapAPI"]

[tool.coverage.run]
source = ["CANape", "CANapAPI"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/versioneer.py",
    "*/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

